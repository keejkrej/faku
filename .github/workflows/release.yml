# GitHub Releases for Faku: user-facing installers wrapping documented
# Native package trees. No eject, no invented Native flags, no zip.
# macOS: unsigned DMG. Linux: amd64 .deb. Windows: silent NSIS .exe.
#
# Flags come from https://native-sdk.dev/docs/cli and
# `native package --help` (printed on each runner).

name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version without v (defaults to app.json). Does not publish a GitHub Release by itself."
        required: false
        type: string
      tag:
        description: "Existing v* tag to publish as a GitHub Release. Empty = Actions artifacts only."
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          manifest=$(python3 -c "import json; print(json.load(open('app.json'))['version'])")
          zon=$(python3 -c 'import re, pathlib, sys; m=re.search(r"\.version\s*=\s*\"([^\"]+)\"", pathlib.Path("app.zon").read_text()); sys.exit("app.zon version not found") if m is None else print(m.group(1))')
          if [[ "$manifest" != "$zon" ]]; then
            echo "app.json version ($manifest) does not match app.zon ($zon)" >&2
            exit 1
          fi

          tag=""
          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            publish=true
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
            if [[ "$tag" != v* ]]; then
              tag="v${tag}"
            fi
            publish=true
          fi

          version="${INPUT_VERSION:-}"
          version="${version#v}"
          if [[ -z "$version" && -n "$tag" ]]; then
            version="${tag#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$manifest"
          fi

          if [[ "$publish" == true && "$version" != "$manifest" ]]; then
            echo "release version ($version) does not match app.json/app.zon ($manifest)" >&2
            exit 1
          fi
          if [[ "$publish" == true && "$tag" != v* ]]; then
            echo "publish tag must be v* (got $tag)" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag publish=$publish"

  package:
    name: Package ${{ matrix.target }}
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    steps:
      - uses: actions/checkout@v4
      # Same action vercel-labs/native CI uses on windows-2022. Native
      # auto-downloads Zig on macOS/Linux; Windows has no managed
      # toolchain, so 0.16.0 must be on PATH before `native build --yes`.
      - uses: vercel-labs/setup-zig@v1
        with:
          version: "0.16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Native CLI
        run: |
          set -euo pipefail
          npm install -g @native-sdk/cli
          native version
          native package --help
      - name: Install Linux GTK host deps
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config dpkg-dev
      - name: Install NSIS
        if: matrix.target == 'windows'
        run: |
          set -euo pipefail
          choco install nsis -y --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >> "$GITHUB_PATH"
          echo "C:\\Program Files\\NSIS" >> "$GITHUB_PATH"
      - name: Build
        run: native build --yes
      - name: Package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          mkdir -p dist

          if [[ "$TARGET" == macos ]]; then
            native package --target macos --archive --signing none
            ls -la zig-out/package
            shopt -s nullglob
            dmgs=(zig-out/package/*.dmg)
            if [[ ${#dmgs[@]} -eq 0 ]]; then
              echo "native package --archive did not produce a .dmg" >&2
              exit 1
            fi
            cp "${dmgs[0]}" "dist/faku-${VERSION}-macos-${ARCH}.dmg"
          elif [[ "$TARGET" == linux ]]; then
            native package --target linux
            ls -la zig-out/package
            pkg="zig-out/package/faku-linux"
            if [[ ! -d "$pkg" ]]; then
              echo "missing $pkg (native package default linux output)" >&2
              exit 1
            fi
            if [[ "$(uname -m)" != "x86_64" ]]; then
              echo "linux .deb is amd64 (ubuntu-latest x64); got $(uname -m)" >&2
              exit 1
            fi
            command -v dpkg-deb >/dev/null 2>&1 || {
              echo "dpkg-deb not found" >&2
              exit 1
            }
            ./packaging/linux/build-deb.sh "$VERSION" "$pkg" \
              "${GITHUB_WORKSPACE}/dist/faku_${VERSION}_amd64.deb"
          elif [[ "$TARGET" == windows ]]; then
            native package --target windows
            ls -la zig-out/package
            pkg="zig-out/package/faku-windows"
            if [[ ! -d "$pkg" ]]; then
              echo "missing $pkg (native package default windows output)" >&2
              exit 1
            fi
            if [[ ! -f "$pkg/faku.exe" ]]; then
              echo "missing $pkg/faku.exe" >&2
              ls -la "$pkg" >&2
              exit 1
            fi
            command -v makensis >/dev/null 2>&1 || {
              echo "makensis not on PATH after choco nsis" >&2
              exit 1
            }
            PY=python3
            command -v python3 >/dev/null 2>&1 || PY=python
            # One line: a column-0 continuation terminates YAML `run: |`
            # so GitHub never registers `name: Release` / workflow_dispatch.
            product_version="$("$PY" -c 'import re,sys; p=re.findall(r"\d+", sys.argv[1]); p=(p+["0","0","0","0"])[:4]; print(".".join(p))' "$VERSION")"
            to_mixed() {
              if command -v cygpath >/dev/null 2>&1; then
                cygpath -m "$1"
              else
                echo "$1"
              fi
            }
            pkg_win=$(to_mixed "$pkg")
            out_win=$(to_mixed "${GITHUB_WORKSPACE}/dist/faku-${VERSION}-windows-x64.exe")
            nsi_win=$(to_mixed "${GITHUB_WORKSPACE}/packaging/windows/faku.nsi")
            makensis \
              -DVERSION="$VERSION" \
              -DPRODUCT_VERSION="$product_version" \
              -DPKGDIR="$pkg_win" \
              -DOUTFILE="$out_win" \
              "$nsi_win"
          else
            echo "unexpected target $TARGET" >&2
            exit 1
          fi

          shopt -s nullglob
          zips=(dist/*.zip dist/*.tar.gz)
          if (( ${#zips[@]} )); then
            echo "refusing zip/tarball artifacts: ${zips[*]}" >&2
            exit 1
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: faku-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [meta, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -la
          shopt -s nullglob
          zips=(*.zip *.tar.gz)
          if (( ${#zips[@]} )); then
            echo "refusing zip/tarball artifacts: ${zips[*]}" >&2
            exit 1
          fi
          files=(*.dmg *.deb *.exe)
          if (( ${#files[@]} != 3 )); then
            echo "expected dmg + deb + exe, got: ${files[*]:-none}" >&2
            exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: faku-release-${{ needs.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: needs.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "$notes" <<EOF
          Faku ${VERSION} desktop installers.

          Built host-native with documented \`native build\` / \`native package\`, then wrapped for normal users.
          Not iOS/Android. Experts compile with Native CLI.

          - macOS: unsigned \`.dmg\` (\`--signing none\`; no Apple identity / notarize)
          - Linux: amd64 \`.deb\` (Debian/Ubuntu; GTK 4 runtime). Fedora/Arch compile with Native CLI.
          - Windows: silent NSIS \`.exe\` (unsigned; SmartScreen). Double-click installs with no wizard. Not MSI.
          EOF
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes" \
            dist/*.dmg dist/*.deb dist/*.exe dist/SHA256SUMS
